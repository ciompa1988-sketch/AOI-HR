<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOI HR — Centrum Zarządzania Pracownikami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fc; --surface:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --primary:#4f46e5; --primary-soft:#eef2ff; --success:#047857; --success-bg:#ecfdf5;
  --warning:#c2410c; --warning-bg:#fff7ed; --danger:#b91c1c; --danger-bg:#fef2f2;
  --radius:16px; --shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:#fff;border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:20}
.brand{padding:26px 22px;border-bottom:1px solid var(--border)}
.brand h1{font-size:20px}
.brand p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:12px;color:var(--muted);font-weight:600}
.nav button:hover{background:#f8fafc;color:var(--text)}
.nav button.active{background:var(--primary-soft);color:var(--primary)}
.nav .employee-switch{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.main{margin-left:270px;min-width:0;flex:1}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.search{width:min(420px,48vw)}
.search input{width:100%;height:42px;border:1px solid var(--border);border-radius:12px;padding:0 14px;background:#f8fafc}
.userbox{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#818cf8,#4f46e5);color:#fff;font-weight:700}
.content{padding:28px}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-header h2{font-size:28px;letter-spacing:-.03em}
.page-header p{color:var(--muted);margin-top:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:40px;border-radius:11px;padding:0 16px;border:1px solid var(--border);background:#fff;font-weight:700}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:#fecaca}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.card,.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.02)}
.card{padding:22px}
.card-clickable{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.card-clickable:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.09);border-color:#c7d2fe}
.card-clickable:focus-visible{outline:3px solid rgba(79,70,229,.25);outline-offset:3px}
.card-hint{display:block;margin-top:12px;color:var(--primary);font-size:13px;font-weight:800}
.card small{color:var(--muted);font-weight:600}
.card strong{display:block;font-size:34px;margin-top:7px}
.badge,.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.ok{background:var(--success-bg);color:var(--success)}
.warn{background:var(--warning-bg);color:var(--warning)}
.danger{background:var(--danger-bg);color:var(--danger)}
.neutral{background:#f1f5f9;color:#475569}
.attention{background:#fef3c7;color:#92400e}
.upcoming{background:#dcfce7;color:#166534}
.critical{background:#fee2e2;color:#b91c1c}
.expired{background:#7f1d1d;color:#fff}
.panel{padding:20px;margin-bottom:20px}
.panel h3{font-size:18px;margin-bottom:16px}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tbody tr:hover td{background:#fafcff}
.link{color:var(--primary);font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;color:var(--muted);padding:7px 12px;border-radius:999px;font-weight:600}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;color:var(--muted);padding:30px}
.profile{display:grid;grid-template-columns:220px 1fr;gap:20px}
.profile-card{text-align:center}
.profile-card .avatar{width:86px;height:86px;font-size:24px;margin:0 auto 12px}
.profile-data{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.info{background:#f8fafc;border-radius:12px;padding:13px}
.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow:auto}
.tab{border:0;background:transparent;padding:11px 13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--primary);border-color:var(--primary)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow);width:min(700px,100%);max-height:92vh;overflow:auto}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border)}
.modal form{padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#f8fafc}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding-top:18px}
.employee-view{max-width:1100px;margin:0 auto}
.hero{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;border-radius:22px;padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero p{opacity:.8;margin-top:5px}
.leave-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.leave-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
.leave-card strong{font-size:30px;display:block;margin-top:5px}

.leave-balance{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-bottom:20px}
.balance-main,.balance-side{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px}
.balance-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.balance-head h3{font-size:22px;margin-bottom:4px}
.balance-year{font-weight:800;color:var(--primary);background:#eef2ff;padding:8px 12px;border-radius:12px}
.balance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.balance-stat{padding:15px;border:1px solid var(--border);border-radius:14px;background:#f8fafc}
.balance-stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.balance-stat strong{font-size:25px}
.balance-total{grid-column:1/-1;background:#eef2ff;border-color:#c7d2fe}
.progress-wrap{margin-top:18px}
.progress-info{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.progress-bar{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#7c3aed);border-radius:999px}
.remaining-number{font-size:42px;font-weight:800;line-height:1;color:#059669;margin:10px 0 6px}
.leave-years{display:grid;gap:12px}
.leave-year{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.leave-year summary{list-style:none;cursor:pointer;padding:17px 19px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-weight:800}
.leave-year summary::-webkit-details-marker{display:none}
.leave-year summary:after{content:'⌄';font-size:20px;color:var(--muted);transition:.2s}
.leave-year[open] summary:after{transform:rotate(180deg)}
.year-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.year-summary small{font-weight:500;color:var(--muted)}
.year-body{padding:0 19px 19px;border-top:1px solid var(--border)}
.year-numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.year-number{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--border)}
.year-number span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.year-number strong{font-size:19px}
.leave-mobile-list{display:none}

.status-action{cursor:pointer;border:none;font:inherit;transition:transform .15s ease,box-shadow .15s ease}
.status-action:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.12)}
.status-action:focus-visible{outline:3px solid rgba(79,70,229,.25);outline-offset:2px}
.hidden{display:none!important}
.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:13px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:100}

.upload-box{border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;background:#f8fafc}
.upload-box input{margin-top:10px;max-width:100%}
.doc-list{display:grid;gap:10px}
.doc-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid var(--border);border-radius:12px;background:#fff}
.doc-meta{min-width:0}
.doc-meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap}
.preview-img{max-width:100%;max-height:65vh;border-radius:12px;border:1px solid var(--border)}
.preview-frame{width:100%;height:65vh;border:1px solid var(--border);border-radius:12px}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.split,.profile{grid-template-columns:1fr}.sidebar{width:230px}.main{margin-left:230px}}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0}.topbar{position:static}.grid4,.leave-summary,.form-grid,.profile-data,.leave-balance,.balance-grid,.year-numbers{grid-template-columns:1fr}.content{padding:18px}.search{display:none}.balance-total{grid-column:auto}.leave-year table{display:none}.leave-mobile-list{display:grid;gap:10px}.leave-mobile-item{padding:12px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}.leave-mobile-item strong,.leave-mobile-item span{display:block}.leave-mobile-item span{font-size:13px;color:var(--muted);margin-top:4px}}

.company-status-card{cursor:pointer;transition:.18s}
.company-status-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.09);border-color:#c7d2fe}
.company-status-line{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:20px;font-weight:800}
.company-status-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.company-status-dot.active{background:#16a34a}
.company-status-dot.suspended{background:#d97706}
.company-status-dot.closed{background:#dc2626}
.company-status-dot.archived{background:#64748b}
.company-status-hint{display:block;margin-top:12px;color:var(--primary);font-size:13px;font-weight:800}
.company-status-option{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);border-radius:13px;background:#fff;font-weight:700;font-size:15px;text-align:left}
.company-status-option:hover{background:#f8fafc;border-color:#a5b4fc}
.company-status-option.selected{background:#eef2ff;border-color:#4f46e5}

@keyframes criticalPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(127,29,29,0)}
  50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(127,29,29,.14)}
}
.status.critical-expired,
.badge.critical-expired{
  background:#7f1d1d;
  color:#fff;
  animation:criticalPulse 1.25s ease-in-out infinite;
}
.status.urgent,
.badge.urgent{
  background:#fee2e2;
  color:#b91c1c;
}
.status.important,
.badge.important{
  background:#fef3c7;
  color:#92400e;
}
.status.safe,
.badge.safe{
  background:#dcfce7;
  color:#166534;
}

.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.calendar-weekdays div{text-align:center;font-weight:800;color:var(--muted);padding:8px}
.calendar-day{min-height:92px;border:1px solid var(--border);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:white}
.calendar-day span{font-size:12px;line-height:1.25}
.calendar-day.empty-day{border:none;background:transparent;cursor:default}
.leave-day{background:#dcfce7!important}
.sick-day{background:#fef3c7!important}
.work-day{background:#ffffff!important}
.holiday-day{background:#dbeafe!important}
.weekend-day{background:#f3f4f6!important}
.calendar-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
.calendar-legend span{display:flex;align-items:center;gap:8px}
.legend-box{width:18px;height:18px;border-radius:5px;border:1px solid var(--border);display:inline-block}
.inbox-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.inbox-filter-card{border:1px solid var(--border);border-radius:16px;padding:16px;background:white;text-align:left;cursor:pointer}
.inbox-filter-card strong{display:block;font-size:28px;margin-top:8px}
.inbox-filter-card.active{outline:3px solid rgba(37,99,235,.15);border-color:#2563eb}
@media(max-width:800px){
 .calendar-day{min-height:68px;padding:8px}
 .calendar-day span{display:none}
 .inbox-filters{grid-template-columns:repeat(2,1fr)}
}


.inbox-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.inbox-thread-list{padding:10px 20px}
.inbox-thread{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:17px 8px;cursor:pointer}
.inbox-thread.unread{background:rgba(37,99,235,.06)}
.quick-contacts{position:sticky;top:18px;max-height:72vh;overflow:auto}
.contact-section h4{margin-bottom:9px}
.contact-list{display:flex;flex-direction:column;gap:7px}
.contact-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:1px solid var(--border);border-radius:12px;background:white;text-align:left;cursor:pointer}
.contact-item:hover{background:var(--bg)}
.contact-item span:last-child{display:flex;flex-direction:column;min-width:0}
.contact-item small{color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-avatar{width:36px;height:36px;border-radius:10px;background:rgba(37,99,235,.10);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
@media(max-width:1050px){.inbox-layout{grid-template-columns:1fr}.quick-contacts{position:static;max-height:none}}


.row-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.icon-btn{
  position:relative;
  width:36px;
  height:36px;
  min-width:36px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  display:inline-grid;
  place-items:center;
  padding:0;
  font-size:16px;
  line-height:1;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.icon-btn:hover{
  transform:translateY(-1px);
  background:var(--bg);
  box-shadow:0 6px 16px rgba(15,23,42,.08);
}
.icon-btn:focus-visible{
  outline:3px solid rgba(37,99,235,.22);
  outline-offset:2px;
}
.icon-btn::after{
  content:attr(data-tooltip);
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:6px 8px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease, transform .15s ease;
  z-index:50;
}
.icon-btn::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:calc(100% + 3px);
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:#111827;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease;
  z-index:50;
}
.icon-btn:hover::after,
.icon-btn:focus-visible::after{
  opacity:1;
  transform:translateX(-50%) translateY(-2px);
}
.icon-btn:hover::before,
.icon-btn:focus-visible::before{
  opacity:1;
}
.danger-icon{
  border-color:#fecaca;
  background:#fff7f7;
}
.danger-icon:hover{
  background:#fee2e2;
}
.medical-icon{
  border-color:#bae6fd;
  background:#f0f9ff;
}
.medical-icon:hover{
  background:#e0f2fe;
}
.warning-icon{
  border-color:#fde68a;
  background:#fffbeb;
}
.warning-icon:hover{
  background:#fef3c7;
}
.mobile-actions{
  margin-top:10px;
}
@media(max-width:800px){
  .icon-btn{
    width:40px;
    height:40px;
    min-width:40px;
  }
}


.employee-home-tabs{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin:18px 0;
}
.employee-home-card{
  min-height:126px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:16px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:7px;
  text-align:left;
  cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.employee-home-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,23,42,.08);
}
.employee-home-card.active{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}
.employee-home-card strong{
  font-size:17px;
}
.employee-home-card small{
  color:var(--muted);
  line-height:1.35;
}
.employee-home-icon{
  font-size:23px;
}
.employee-home-content{
  min-height:310px;
}
.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.section-heading p{
  color:var(--muted);
  margin-top:5px;
}
.employee-summary-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.summary-box{
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--bg);
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.summary-box span{
  color:var(--muted);
  font-size:13px;
}
.summary-box strong{
  font-size:20px;
}
.compact-list{
  margin-top:18px;
  border-top:1px solid var(--border);
}
.compact-row{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  padding:14px 2px;
  border-bottom:1px solid var(--border);
}
.compact-row div:first-child{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.compact-row small{
  color:var(--muted);
}
@media(max-width:1050px){
  .employee-home-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:700px){
  .employee-home-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .employee-summary-grid{grid-template-columns:1fr}
  .compact-row{align-items:flex-start;flex-direction:column}
}


.absence-category-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.absence-category{border:1px solid var(--border);border-radius:999px;background:#fff;padding:9px 13px;font-weight:700;cursor:pointer}
.absence-category.active{background:#eef2ff;border-color:#6366f1;color:#4338ca}
.employee-summary-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}


.premium-inbox-shell{
 min-height:calc(100vh - 130px);
 padding:28px;
 border-radius:26px;
 background:
  radial-gradient(circle at 100% 0%,rgba(99,102,241,.16),transparent 34%),
  radial-gradient(circle at 0% 100%,rgba(14,165,233,.10),transparent 30%),

.premium-inbox-top{

.premium-inbox-top h2{

}
.premium-inbox-top p{color:#64748b}
.premium-eyebrow{

 letter-spacing:1.8px;

}
.premium-new-chat{

}
.premium-filter-grid{

.premium-filter-card{

.premium-messenger-layout{

}
.premium-contacts-column,
.premium-topics-column{

}
.premium-topics-column{background:#fff}
.premium-search-box{

 align-items:center;
 gap:8px;
}
.premium-search-box input{
 border:0;
 outline:0;
 width:100%;
 background:transparent;
}
.premium-section-label{

 letter-spacing:1.4px;
 font-weight:900;
 color:#94a3b8;
}

.premium-contact-list{

 flex-direction:column;
 gap:4px;
 padding:0 10px;
}
.premium-contact{

 border:0;
 border-radius:14px;
 background:transparent;
 padding:10px;
 display:flex;
 align-items:center;
 gap:10px;
 text-align:left;
 cursor:pointer;
}
.premium-contact:hover{background:#eef2ff}
.premium-contact.active{
 background:linear-gradient(135deg,#eef2ff,#e0e7ff);

}
.premium-avatar{

 height:42px;
 border-radius:14px;

 place-items:center;
 flex:0 0 auto;

 background:linear-gradient(145deg,#e0e7ff,#c7d2fe);
}
.premium-avatar.company{

 background:linear-gradient(145deg,#e0f2fe,#bae6fd);
}
.premium-avatar.large{width:48px;height:48px}
.premium-contact-copy{
 min-width:0;
 display:flex;
 flex-direction:column;
 gap:3px;
 flex:1;
}
.premium-contact-copy strong,
.premium-contact-copy small{

 overflow:hidden;
 text-overflow:ellipsis;
}
.premium-contact-copy small{color:#64748b}
.premium-unread{

 height:22px;
 padding:0 6px;
 border-radius:999px;
 display:grid;
 place-items:center;

 background:#4f46e5;
 font-size:11px;
 font-weight:900;
}
.premium-contact-header{
 padding:18px;
 display:flex;
 gap:12px;
 align-items:center;
 border-bottom:1px solid #e5eaf2;
}
.premium-contact-header span:last-child{

 flex-direction:column;
 gap:3px;
 min-width:0;
}
.premium-contact-header small{color:#64748b}
.premium-topics-heading{
 padding:14px 16px 9px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 color:#94a3b8;
 font-size:11px;
 letter-spacing:1.3px;
 font-weight:900;
}
.premium-topics-heading button{
 width:30px;
 height:30px;
 border:1px solid #dbe3ef;
 border-radius:9px;
 background:#fff;
 cursor:pointer;
}
.premium-topic-list{
 padding:8px;
 display:flex;
 flex-direction:column;
 gap:8px;
}
.premium-topic-card{
 width:100%;
 border:1px solid #e2e8f0;
 border-radius:16px;
 padding:13px;
 background:#fff;
 text-align:left;
 cursor:pointer;
 transition:.16s ease;
}
.premium-topic-card:hover{
 transform:translateY(-1px);
 box-shadow:0 10px 25px rgba(15,23,42,.07);
}
.premium-topic-card.active{
 border-color:#6366f1;
 background:linear-gradient(145deg,#f5f3ff,#eef2ff);
 box-shadow:0 0 0 3px rgba(99,102,241,.10);
}
.premium-topic-card.unread{border-left:4px solid #4f46e5}
.premium-topic-top{
 display:flex;
 justify-content:space-between;
 gap:8px;
 align-items:flex-start;
}
.premium-topic-category{
 display:inline-block;
 margin-top:7px;
 color:#4f46e5;
 font-size:11px;
 font-weight:850;
}
.premium-topic-card p{
 margin:8px 0;
 color:#475569;
 font-size:13px;
 line-height:1.4;
}
.premium-topic-card small{color:#94a3b8}
.premium-empty-topic,
.premium-no-thread{
 min-height:360px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:#64748b;
 padding:30px;
}
.premium-empty-topic span,
.premium-no-thread-icon{font-size:42px}
.premium-chat-column{
 min-width:0;
 display:flex;
 flex-direction:column;
 background:
  radial-gradient(circle at 25% 10%,rgba(99,102,241,.06),transparent 24%),
  #f8fafc;
}
.premium-chat-header{
 padding:18px 22px;
 display:flex;
 justify-content:space-between;
 gap:14px;
 align-items:flex-start;
 border-bottom:1px solid #e2e8f0;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(14px);
}
.premium-chat-header h3{
 margin:4px 0;
 font-size:22px;
}
.premium-chat-header p{color:#64748b}
.premium-chat-category{
 color:#4f46e5;
 font-size:11px;
 font-weight:900;
 letter-spacing:1px;
}
.premium-chat-actions{
 display:flex;
 align-items:center;
 gap:8px;
}
.premium-action{
 border:1px solid #dbe3ef;
 border-radius:11px;
 padding:9px 12px;
 background:#fff;
 font-weight:800;
 cursor:pointer;
}
.premium-round-action{
 width:38px;
 height:38px;
 border:1px solid #dbe3ef;
 border-radius:11px;
 background:#fff;
 cursor:pointer;
}
.premium-chat-body{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
}
.premium-messages{
 flex:1;
 max-height:500px;
 overflow:auto;
 padding:24px;
}
.premium-message-row{
 display:flex;
 margin:12px 0;
}
.premium-message-row.mine{justify-content:flex-end}
.premium-message-row.theirs{justify-content:flex-start}
.premium-message-bubble{
 max-width:75%;
 border-radius:18px 18px 18px 6px;
 padding:13px 15px;
 background:#fff;
 box-shadow:0 8px 22px rgba(15,23,42,.07);
}
.premium-message-row.mine .premium-message-bubble{
 color:#fff;
 border-radius:18px 18px 6px 18px;
 background:linear-gradient(135deg,#4f46e5,#2563eb);
}
.premium-message-bubble>strong{
 display:block;
 margin-bottom:6px;
}
.premium-message-text{
 white-space:pre-wrap;
 line-height:1.48;
}
.premium-message-bubble>small{
 display:block;
 margin-top:8px;
 opacity:.72;
 text-align:right;
}
.premium-file-attachment,
.premium-file-summary{
 margin-top:10px;
 padding:10px;
 border-radius:13px;
 display:flex;
 gap:10px;
 align-items:center;
 background:rgba(255,255,255,.14);
 border:1px solid rgba(255,255,255,.24);
}
.premium-message-row.theirs .premium-file-attachment{
 background:#f1f5f9;
 border-color:#e2e8f0;
}
.premium-file-attachment span:last-child,
.premium-file-summary span:last-child{
 display:flex;
 flex-direction:column;
 gap:3px;
 min-width:0;
}
.premium-image-attachment{
 margin-top:10px;
 border:0;
 border-radius:14px;
 overflow:hidden;
 padding:0;
 background:transparent;
 text-align:left;
 cursor:pointer;
}
.premium-image-attachment img{
 display:block;
 width:100%;
 max-width:300px;
 max-height:230px;
 object-fit:cover;
}
.premium-image-attachment span{
 display:block;
 padding:8px 2px 0;
 font-size:12px;
}
.premium-closed-note{
 margin:0 22px 14px;
 padding:12px;
 border-radius:12px;
 color:#92400e;
 background:#fffbeb;
 border:1px solid #fde68a;
}
.premium-composer{
 margin:0 18px 18px;
 padding:10px;
 border:1px solid #dbe3ef;
 border-radius:16px;
 background:#fff;
 display:flex;
 align-items:flex-end;
 gap:8px;
 box-shadow:0 12px 30px rgba(15,23,42,.07);
}
.premium-composer.disabled{opacity:.62}
.premium-composer textarea{
 flex:1;
 min-height:42px;
 max-height:120px;
 resize:none;
 border:0;
 outline:0;
 padding:10px;
 background:transparent;
}
.premium-attach-button,
.premium-send-button{
 width:42px;
 height:42px;
 border:0;
 border-radius:12px;
 cursor:pointer;
}
.premium-attach-button{
 background:#f1f5f9;
}
.premium-send-button{
 color:#fff;
 background:linear-gradient(135deg,#4f46e5,#2563eb);
 box-shadow:0 8px 18px rgba(79,70,229,.25);
}
.premium-attachment-preview{
 padding:0 18px 10px;
}
.premium-pending-file{
 width:100%;
 border:1px solid #dbe3ef;
 border-radius:13px;
 padding:10px;
 display:flex;
 gap:10px;
 align-items:center;
 background:#fff;
}
.premium-pending-file span:nth-child(2){
 flex:1;
 display:flex;
 flex-direction:column;
}
.premium-pending-file button{
 border:0;
 background:transparent;
 font-size:22px;
 cursor:pointer;
}
.premium-thread-files{
 margin:0 18px 18px;
 padding:14px;
 border-radius:16px;
 background:rgba(255,255,255,.82);
 border:1px solid #e2e8f0;
}
.premium-thread-files>span{
 display:block;
 margin-bottom:9px;
 color:#94a3b8;
 font-size:10px;
 letter-spacing:1.2px;
 font-weight:900;
}
.premium-thread-files>div{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}
.premium-file-summary{
 margin:0;
 background:#f8fafc;
 border-color:#e2e8f0;
}
.premium-new-thread-recipient{
 display:flex;
 gap:12px;
 align-items:center;
 padding:12px;
 margin-bottom:16px;
 border-radius:15px;
 background:#f8fafc;
 border:1px solid #e2e8f0;
}
.premium-new-thread-recipient span:last-child{
 display:flex;
 flex-direction:column;
 gap:3px;
}
@media(max-width:1200px){
 .premium-messenger-layout{grid-template-columns:230px 300px minmax(0,1fr)}
}
@media(max-width:980px){
 .premium-filter-grid{grid-template-columns:repeat(2,1fr)}
 .premium-messenger-layout{grid-template-columns:220px minmax(0,1fr)}
 .premium-topics-column{display:none}
}
@media(max-width:720px){
 .premium-inbox-shell{padding:14px}
 .premium-inbox-top{flex-direction:column}
 .premium-messenger-layout{grid-template-columns:1fr}
 .premium-contacts-column{display:none}
 .premium-message-bubble{max-width:90%}
}


:root{
 --premium-navy:#0f172a;
 --premium-indigo:#4f46e5;
 --premium-blue:#2563eb;
 --premium-cyan:#0ea5e9;
 --premium-soft:#f4f7fb;
 --premium-card:#ffffff;
 --premium-border:#dce4ef;
 --premium-muted:#64748b;
}
body{
 background:
  radial-gradient(circle at 88% 8%,rgba(79,70,229,.12),transparent 24%),
  radial-gradient(circle at 15% 92%,rgba(14,165,233,.10),transparent 26%),
  linear-gradient(145deg,#eef3f9 0%,#f8fafc 48%,#edf3fa 100%);
 color:var(--premium-navy);
}
.app{
 background:transparent;
}
.sidebar{
 background:
  linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,250,252,.97));
 border-right:1px solid rgba(203,213,225,.75);
 box-shadow:12px 0 38px rgba(15,23,42,.06);
 backdrop-filter:blur(18px);
}
.brand{
 border-bottom:1px solid rgba(203,213,225,.7);
}
.brand h1{
 color:#111827;
 letter-spacing:-.5px;
}
.brand p{
 color:#64748b;
 letter-spacing:1.5px;
}
.nav button{
 margin:4px 10px;
 width:calc(100% - 20px);
 border-radius:13px;
 color:#53627a;
 transition:background .16s ease,color .16s ease,transform .16s ease,box-shadow .16s ease;
}
.nav button:hover{
 background:#eef2ff;
 color:#3730a3;
 transform:translateX(2px);
}
.nav button.active{
 color:#fff;
 background:linear-gradient(135deg,#4f46e5,#2563eb);
 box-shadow:0 12px 26px rgba(79,70,229,.22);
}
.nav .employee-switch{
 background:#fff;
 border:1px solid #dce4ef;
 color:#334155;
 box-shadow:none;
}
.nav .employee-switch:hover{
 border-color:#a5b4fc;
 background:#f5f3ff;
 color:#4338ca;
}
.main{
 background:transparent;
}
.topbar{
 margin:14px 18px 0;
 border:1px solid rgba(203,213,225,.75);
 border-radius:18px;
 background:rgba(255,255,255,.82);
 box-shadow:0 12px 30px rgba(15,23,42,.06);
 backdrop-filter:blur(18px);
}
.search input{
 border:1px solid #dbe3ef;
 border-radius:13px;
 background:#f8fafc;
}
.avatar{
 background:linear-gradient(135deg,#4f46e5,#2563eb);
 box-shadow:0 10px 22px rgba(79,70,229,.24);
}
.content{
 padding-top:24px;
}
.page-header h2{
 font-size:36px;
 letter-spacing:-1px;
}
.page-header p{
 color:#64748b;
}
.grid4{
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:15px;
}
.card,
.panel,
.leave-year,
.leave-balance,
.employee-home-card,
.info,
.summary-box{
 border-color:rgba(203,213,225,.82);
 background:rgba(255,255,255,.92);
 box-shadow:0 14px 36px rgba(15,23,42,.06);
}
.card{
 border-radius:20px;
 padding:19px;
 position:relative;
 overflow:hidden;
}
.card::after{
 content:"";
 position:absolute;
 width:90px;
 height:90px;
 right:-38px;
 top:-38px;
 border-radius:50%;
 background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(14,165,233,.08));
}
.card-clickable:hover{
 transform:translateY(-3px);
 border-color:#a5b4fc;
 box-shadow:0 20px 42px rgba(15,23,42,.10);
}
.card small{
 color:#64748b;
 font-weight:800;
}
.card strong{
 color:#111827;
}
.premium-message-dashboard-card{
 background:
  radial-gradient(circle at 100% 0%,rgba(255,255,255,.26),transparent 35%),
  linear-gradient(135deg,#312e81,#4f46e5 55%,#2563eb);
}
.premium-message-dashboard-card small,
.premium-message-dashboard-card strong,
.premium-message-dashboard-card .card-hint{
 color:#fff;
}
.premium-message-dashboard-card .badge{
 background:rgba(255,255,255,.18);
 color:#fff;
 border-color:rgba(255,255,255,.28);
}
.panel{
 border-radius:22px;
}
.btn{
 border-radius:12px;
 font-weight:800;
 transition:transform .15s ease,box-shadow .15s ease;
}
.btn:hover{
 transform:translateY(-1px);
 box-shadow:0 8px 20px rgba(15,23,42,.08);
}
.btn.primary{
 border:0;
 color:#fff;
 background:linear-gradient(135deg,#4f46e5,#2563eb);
 box-shadow:0 10px 24px rgba(79,70,229,.22);
}
.btn.danger{
 background:#fff5f5;
 border-color:#fecaca;
 color:#b91c1c;
}
table{
 border-collapse:separate;
 border-spacing:0;
}
thead th{
 color:#64748b;
 letter-spacing:.5px;
}
tbody tr{
 transition:background .15s ease;
}
tbody tr:hover{
 background:#f8faff;
}
.status,
.badge{
 border-radius:999px;
 font-weight:850;
}
.modal-bg{
 backdrop-filter:blur(8px);
 background:rgba(15,23,42,.48);
}
.modal{
 border:1px solid rgba(255,255,255,.55);
 border-radius:24px;
 box-shadow:0 32px 90px rgba(15,23,42,.28);
}
.modal header{
 background:linear-gradient(180deg,#fff,#fbfdff);
}
.employee-home-card.active{
 background:linear-gradient(145deg,#f5f3ff,#eef2ff);
 border-color:#818cf8;
}
.calendar-day{
 box-shadow:0 7px 18px rgba(15,23,42,.04);
}
.toast{
 border-radius:14px;
 box-shadow:0 18px 44px rgba(15,23,42,.22);
}
.premium-topics-column{
 max-width:285px;
}
.premium-topic-list{
 gap:5px;
 padding:7px;
}
.premium-topic-card{
 min-height:auto;
 padding:9px 10px;
 border-radius:12px;
}
.premium-topic-top{
 align-items:center;
}
.premium-topic-top strong{
 font-size:13px;
 line-height:1.25;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}
.premium-topic-card .status{
 padding:4px 7px;
 font-size:9px;
 white-space:nowrap;
}
.premium-topic-card>small{
 display:block;
 margin-top:5px;
 font-size:10px;
}
.premium-messenger-layout{
 grid-template-columns:250px 285px minmax(0,1fr);
}
@media(max-width:1350px){
 .grid4{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:900px){
 .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .premium-messenger-layout{grid-template-columns:220px minmax(0,1fr)}
}
@media(max-width:620px){
 .grid4{grid-template-columns:1fr}
 .page-header h2{font-size:30px}
}


.premium-topic-person{
 display:flex;
 flex-direction:column;
 gap:2px;
 margin-bottom:7px;
}
.premium-topic-person strong{
 font-size:14px;
 line-height:1.25;
 color:#111827;
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.premium-topic-person span{
 font-size:10px;
 color:#64748b;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.premium-topic-subject{

 font-weight:750;

 overflow:hidden;

.premium-topic-card.unread .premium-topic-person strong{

.premium-topic-card.unread .premium-topic-subject{

.filtered-contact-column{

 flex-direction:column;

function addYearsToDate(dateString,years){
 if(!dateString) return '';
 const date=new Date(dateString+'T00:00:00');
 date.setFullYear(date.getFullYear()+years);
 return date.toISOString().slice(0,10);
}

function hasDisabilityExtraLeave(employee,referenceDate=new Date()){
 if(!['Umiarkowany','Znaczny'].includes(employee.disabilityDegree)) return false;
 if(!employee.disabilityFrom) return false;
 const entitlementDate=new Date(addYearsToDate(employee.disabilityFrom,1)+'T00:00:00');
 const checkDate=referenceDate instanceof Date?referenceDate:new Date(referenceDate+'T00:00:00');
 return checkDate>=entitlementDate;
}

function disabilityExtraLeave(employee,referenceDate=new Date()){
 return hasDisabilityExtraLeave(employee,referenceDate)?10:0;
}

function calculatedAnnualLeave(employee,referenceDate=new Date()){
 const base=Number(employee.leaveBase??employee.leaveTotal??26);
 return base+disabilityExtraLeave(employee,referenceDate);
}

function syncEmployeeLeaveEntitlement(employee){
 if(employee.leaveBase===undefined){
  const current=Number(employee.leaveTotal||26);
  employee.leaveBase=Math.max(0,current-disabilityExtraLeave(employee));
 }
 employee.leaveTotal=calculatedAnnualLeave(employee);
 return employee.leaveTotal;
}

employees.forEach(employee=>syncEmployeeLeaveEntitlement(employee));

}

function daysToDate(date){
 if(!date||date==='Bezterminowa') return null;

 const today=new Date();
 today.setHours(0,0,0,0);

 const end=new Date(date+'T00:00:00');
 if(Number.isNaN(end.getTime())) return null;

 return Math.ceil((end-today)/(1000*60*60*24));
}

function dateStatusClass(date){
 if(date==='Bezterminowa') return 'safe';
 if(!date) return 'critical-expired';

 const days=daysToDate(date);
 if(days===null||days<0) return 'critical-expired';
 if(days<30) return 'urgent';
 if(days<=60) return 'important';
 return 'safe';
}

function dateStatusLabel(date){
 if(date==='Bezterminowa') return 'Bezterminowa';
 if(!date) return 'Brak terminu';

 const days=daysToDate(date);
 if(days===null) return 'Nieprawidłowa data';
 if(days<0) return `Krytyczny: po terminie ${Math.abs(days)} dni`;
 if(days===0) return 'Termin dzisiaj';
 if(days<30) return `Pilne: ${days} dni`;
 if(days<=60) return `Ważne: ${days} dni`;
 return `OK: ${days} dni`;
}

 return employees.filter(employee=>{

function dashboardMedicalWarningCount(){

function employeeActionIssues(employee){
 const issues=[];

 const medicalDays=daysToDate(employee.medical);
 if(medicalDays===null){
  issues.push({type:'medical',label:'Brak terminu badań',level:'critical'});
 }else if(medicalDays<0){
  issues.push({type:'medical',label:`Badania po terminie ${Math.abs(medicalDays)} dni`,level:'critical'});
 }else if(medicalDays<30){
  issues.push({type:'medical',label:`Badania za ${medicalDays} dni`,level:'urgent'});
 }else if(medicalDays<=60){
  issues.push({type:'medical',label:`Badania za ${medicalDays} dni`,level:'warning'});
 }

 const bhpDays=daysToDate(employee.bhp);
 if(bhpDays===null){
  issues.push({type:'bhp',label:'Brak terminu BHP',level:'critical'});
 }else if(bhpDays<0){
  issues.push({type:'bhp',label:`BHP po terminie ${Math.abs(bhpDays)} dni`,level:'critical'});
 }else if(bhpDays<30){
  issues.push({type:'bhp',label:`BHP za ${bhpDays} dni`,level:'urgent'});
 }else if(bhpDays<=60){
  issues.push({type:'bhp',label:`BHP za ${bhpDays} dni`,level:'warning'});
 }

 if(employee.contract!=='Bezterminowa'){
  const contractDays=daysToDate(employee.contract);

  if(contractDays===null){
   issues.push({type:'contract',label:'Brak terminu umowy',level:'critical'});
  }else if(contractDays<0){
   issues.push({type:'contract',label:`Umowa po terminie ${Math.abs(contractDays)} dni`,level:'critical'});
  }else if(contractDays<30){
   issues.push({type:'contract',label:`Umowa za ${contractDays} dni`,level:'urgent'});
  }else if(contractDays<=60){
   issues.push({type:'contract',label:`Umowa za ${contractDays} dni`,level:'warning'});
  }
 }

 const pendingLeaves=leaveRequests.filter(request=>
  request.employeeId===employee.id&&request.status==='Oczekuje'
 ).length;

 if(pendingLeaves){
  issues.push({
   type:'leave',
   label:`${pendingLeaves} ${pendingLeaves===1?'wniosek urlopowy':'wnioski urlopowe'}`,
   level:'warning'
  });
 }

 return issues;
}

function companyActionIssues(companyId){
 return employees
  .filter(employee=>employee.companyId===companyId)
  .flatMap(employee=>employeeActionIssues(employee).map(issue=>({
   ...issue,
   employeeId:employee.id,
   employeeName:employee.name
  })));
}

function issueLevelRank(level){
 return level==='critical'?0:level==='urgent'?1:2;
}

function issueLevelLabel(level){
 if(level==='critical') return 'Krytyczne';
 if(level==='urgent') return 'Pilne';
 return 'Do zaplanowania';
}

function issueLevelClass(level){
 if(level==='critical') return 'critical-expired';
 if(level==='urgent') return 'urgent';
 return 'important';
}

function openCompanyIssue(employeeId,type){
 if(type==='leave'){
  const request=leaveRequests.find(item=>item.employeeId===employeeId&&item.status==='Oczekuje');
  if(request){
   openLeaveRequest(request.id);
   return;
  }
 }

 openEmployeeTabDirect(employeeId,type);
}

function companyActionCount(companyId){
 return employees
  .filter(employee=>employee.companyId===companyId)
  .reduce((count,employee)=>{
   const medical=daysToDate(employee.medical);
   const bhp=daysToDate(employee.bhp);
   const contract=employee.contract==='Bezterminowa'?null:daysToDate(employee.contract);

   if(medical===null||medical<=60) count++;
   if(bhp===null||bhp<=60) count++;
   if(employee.contract!=='Bezterminowa'&&(contract===null||contract<=60)) count++;

   return count;
  },0);
}

  .filter(e=>e.contract!=='Bezterminowa'&&daysToDate(e.contract)>=0&&daysToDate(e.contract)<30)
  .sort((a,b)=>a.contract.localeCompare(b.contract));
 const important=employees
  .filter(e=>e.contract!=='Bezterminowa'&&daysToDate(e.contract)>=30&&daysToDate(e.contract)<=60)
  .sort((a,b)=>a.contract.localeCompare(b.contract));
 const safe=employees
  .filter(e=>e.contract!=='Bezterminowa'&&daysToDate(e.contract)>60)
  .sort((a,b)=>a.contract.localeCompare(b.contract));

 return deadlineView(
  'Terminy umów',
  'Widoczne są tylko umowy wymagające działania.',
  'contract',
  expired,
  urgent,
  important,
  safe,
  'Umowy'
 );
}

function openCurrentDeadlineModal(title,key,tabLabel){
 const current=employees
  .filter(employee=>{
   if(key==='contract'&&employee.contract==='Bezterminowa') return true;
   const days=daysToDate(employee[key]);
   return days!==null&&days>60;
  })
  .sort((a,b)=>{
   if(a[key]==='Bezterminowa') return 1;
   if(b[key]==='Bezterminowa') return -1;
   return String(a[key]).localeCompare(String(b[key]));
  });

 openModal(`Aktualne — ${title}`,`
  ${current.length?`
   <table>
    <thead><tr><th>Pracownik</th><th>Firma</th><th>Stanowisko</th><th>Termin</th><th></th></tr></thead>

 `,event=>event.preventDefault());
}

const companyStatuses={

 'Zawieszona':{dot:'suspended'},
 'Zamknięta':{dot:'closed'},

};

function companyStatusDot(status){
 return (companyStatuses[status]||companyStatuses['Aktywna']).dot;
}

function openCompanyStatusModal(companyId){
 const c=companies.find(x=>x.id===companyId);
 if(!c) return;

 openModal(
  'Zmień status firmy',
  `
   <p style="color:var(--muted);margin:0 0 18px">${c.name}</p>

   <div>
    ${Object.keys(companyStatuses).map(status=>`

 );

function confirmCompanyStatus(companyId,newStatus){
 const c=companies.find(x=>x.id===companyId);
 if(!c) return;

 if(c.status===newStatus){
  closeModal();
  return;
 }

 openModal(
  'Potwierdź zmianę',
  `
   <p style="color:var(--muted);margin:0 0 18px">${c.name}</p>

   <p style="margin:0 0 22px;font-size:16px;line-height:1.6">

    <strong>„${c.status}”</strong> na <strong>„${newStatus}”</strong>?

   <div style="display:flex;justify-content:flex-end;gap:10px">
    <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
    <button type="button" class="btn primary"

 );
}

function saveCompanyStatus(companyId,newStatus){
 const c=companies.find(x=>x.id===companyId);
 if(!c) return;

 c.status=newStatus;
 closeModal();
 openCompany(companyId);

 if(typeof showToast==='function'){

 }
}

function openEmployeeTabDirect(employeeId,tab){
 openEmployee(employeeId);
 requestAnimationFrame(()=>{
  const labels={medical:'Badania',bhp:'BHP',contract:'Umowy',leave:'Urlopy',data:'Dane'};
  const button=[...document.querySelectorAll('.tabs .tab')].find(item=>item.textContent.trim()===labels[tab]);
  if(button)showEmployeeTab(employeeId,tab,button);
 });
}

function employeeLeaveYearsView(employeeId){

  .filter(item=>item.employeeId===employeeId)

 if(!balances.length){
  const e=employees.find(x=>x.id===employeeId);
  balances.push({
   employeeId,
   year:new Date().getFullYear(),
   base:e?.leaveTotal||26,
   carried:0,
   used:e?.leaveUsed||0
  });
 }

 const current=balances[0];
 const total=current.base+current.carried;
 const remaining=Math.max(0,total-current.used);
 const percent=total?Math.min(100,Math.round((current.used/total)*100)):0;

 return `
  <div class="leave-balance">
   <div class="balance-main">
    <div class="balance-head">
     <div>
      <h3>Bilans urlopu</h3>
      <p>Aktualny stan dni urlopowych pracownika.</p>

    </div>
    <div class="balance-grid">
     <div class="balance-stat"><span>Limit podstawowy</span><strong>${current.base} dni</strong></div>
     <div class="balance-stat"><span>Przeniesione z ${current.year-1}</span><strong>+ ${current.carried} dni</strong></div>
     <div class="balance-stat balance-total"><span>Łącznie do wykorzystania</span><strong>${total} dni</strong></div>
    </div>
    <div class="progress-wrap">
     <div class="progress-info"><span>Wykorzystano ${current.used} z ${total} dni</span><strong>${percent}%</strong></div>
     <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
    </div>
   </div>
   <div class="balance-side">
    <small style="color:var(--muted)">Pozostało w ${current.year}</small>
    <div class="remaining-number">${remaining}</div>
    <strong>dni urlopu</strong>
    <p style="color:var(--muted);margin-top:14px;font-size:13px">
     ${current.carried>0?`${current.carried} dni zostało przeniesionych z poprzedniego roku.`:'Brak dni przeniesionych z poprzedniego roku.'}
    </p>
   </div>
  </div>
  ${!employeeMode&&!managerMode?`<div class="panel" style="box-shadow:none;margin:18px 0">

    </div>
   </div>
  </div>`:''}

  <div class="leave-years">
   ${balances.map((balance,index)=>leaveYearAccordion(employeeId,balance,index===0)).join('')}
  </div>`;
}

function toggleHistoricalCustomLeaveType(){
 const select=document.getElementById('historyLeaveType');
 const input=document.getElementById('historyCustomLeaveType');
 if(!select||!input) return;
 input.style.display=select.value==='Inny'?'block':'none';
 if(select.value!=='Inny') input.value='';
}

function calculateHistoricalLeaveDays(){
 const from=document.getElementById('historyLeaveFrom')?.value;
 const to=document.getElementById('historyLeaveTo')?.value;
 const input=document.getElementById('historyLeaveDays');
 if(!from||!to||!input) return;

 const start=new Date(from+'T00:00:00');
 const end=new Date(to+'T00:00:00');
 if(end<start){input.value='';return}

 let count=0;
 const cursor=new Date(start);
 while(cursor<=end){
  const day=cursor.getDay();
  if(day!==0&&day!==6) count++;
  cursor.setDate(cursor.getDate()+1);
 }
 input.value=count;
}

   linked.status='Zaakceptowany';
   linked.interrupted=false;

function recalculateInterruptedLeave(leave,sick){
 const base=leave.originalSnapshot;
 if(!base) return;

 const employee=employees.find(e=>e.id===leave.employeeId);
 const balance=leaveBalances.find(item=>item.employeeId===leave.employeeId&&item.year===Number(base.from.slice(0,4)));

 // Przywróć bazowy bilans, a następnie policz nowy wpływ.
 if(base.balanceApplied){
  const previousOverlapEnd=leave.interruptedFrom&&leave.originalTo
   ? (sick.to<base.to?sick.to:base.to)
   : base.to;
 }

 const from=sick.from;
 const to=sick.to;
 const overlapTo=to<base.to?to:base.to;
 const restored=from<=base.to?workingDaysBetween(from,overlapTo):0;
 const remaining=from<=base.from?0:workingDaysBetween(base.from,previousCalendarDay(from));

 leave.from=base.from;
 leave.to=remaining===0?base.from:previousCalendarDay(from);
 leave.days=remaining;
 leave.status=remaining===0?'Anulowany':'Zaakceptowany';
 leave.cancelReason=remaining===0?'Urlop w całości zastąpiony zwolnieniem lekarskim':'';
 leave.interruptedFrom=from;

 // Ustaw bilans na bazową wartość minus dni objęte chorobowym.
 if(base.balanceApplied){
  const originalUsedWithoutThisLeave=Math.max(0,(balance?.used??employee.leaveUsed)-leave.originalDays);
  const newUsed=originalUsedWithoutThisLeave+remaining;
  if(balance) balance.used=Math.max(0,newUsed);
  employee.leaveUsed=Math.max(0,newUsed);
 }
}

function confirmDeleteSickLeave(requestId){
 const sick=leaveRequests.find(r=>r.id===requestId&&r.type==='Zwolnienie lekarskie');
 if(!sick) return;

 const linked=leaveRequests.find(r=>r.id===sick.linkedLeaveId);
 const employeeId=sick.employeeId;

 if(linked&&linked.originalSnapshot){
  const employee=employees.find(e=>e.id===linked.employeeId);
  const snapshot=linked.originalSnapshot;

  linked.from=snapshot.from;
  linked.to=snapshot.to;
  linked.days=snapshot.days;
  linked.status='Zaakceptowany';
  linked.interrupted=false;
  linked.interruptedFrom=null;
  linked.cancelReason='';
  linked.linkedSickId=null;
  linked.originalSnapshot=null;

  if(snapshot.balanceApplied){
   const balance=leaveBalances.find(item=>item.employeeId===linked.employeeId&&item.year===Number(snapshot.from.slice(0,4)));
   if(balance) balance.used+=Math.max(0,snapshot.days-linked.days);
   employee.leaveUsed=Math.max(employee.leaveUsed,snapshot.days);
  }
 }

 leaveRequests=leaveRequests.filter(r=>r.id!==requestId);
 closeModal();
 showToast('Chorobowe zostało usunięte');
 openEmployeeTabDirect(employeeId,'leave');
}

function setInboxFilter(filter){

function threadDirectionForAccountant(thread){
 const last=thread.messages[thread.messages.length-1];
 return last?.senderRole==='accountant'?'sent':'incoming';
}


let selectedInboxContact={type:'employee',id:1};
let selectedCompanyFilters=[];
let selectedInboxContactOnly=false;
let selectedInboxThreadId=1;
let pendingChatAttachment=null;

function contactMeta(type,id){
 if(type==='employee'){
  const employee=employees.find(item=>item.id===id);
  return {
   name:employee?.name||'Pracownik',
   subtitle:employee?`${companyName(employee.companyId)} · ${employee.position||'Pracownik'}`:'',
   initials:employee?.name.split(' ').map(part=>part[0]).join('').slice(0,2)||'PR',
   companyId:employee?.companyId||null,
   employeeId:employee?.id||null
  };
 }

 const company=companies.find(item=>item.id===id);
 return {
  name:company?.contact||'Szef firmy',
  subtitle:company?.name||'Firma',
  initials:(company?.contact||company?.name||'SF').split(' ').map(part=>part[0]).join('').slice(0,2),
  companyId:company?.id||null,
  employeeId:null
 };
}

function contactThreads(type,id){
 return inboxThreads
  .filter(thread=>{
   if(type==='employee'){
    return thread.employeeId===id && thread.recipientType!=='manager';
   }
   return thread.companyId===id && thread.recipientType==='manager';
  })
  .sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
}

function ensureSelectedThread(){
 const threads=filteredThreadsForContact();

 if(!threads.length){
  selectedInboxThreadId=null;
  return;
 }

 const activeThread=threads.find(thread=>thread.id===selectedInboxThreadId);

 if(!activeThread){
  const firstThread=threads[0];
  const contact=threadContactMeta(firstThread);

  selectedInboxThreadId=firstThread.id;
  selectedInboxContact={type:contact.type,id:contact.id};
 }
}



function companyUnreadCount(companyId){
 return inboxThreads.filter(thread=>thread.companyId===companyId&&!thread.readByAccountant).length;
}

function toggleCompanyFilter(companyId,checked){
 if(checked){
  if(!selectedCompanyFilters.includes(companyId)){
   selectedCompanyFilters.push(companyId);
  }
 }else{
  selectedCompanyFilters=selectedCompanyFilters.filter(id=>id!==companyId);
 }

 inboxFilter='all';
 selectedInboxContactOnly=false;

 const scopedThreads=threadsWithinSelectedCompanies();

 if(scopedThreads.length){
  const firstThread=scopedThreads[0];
  const contact=threadContactMeta(firstThread);

  selectedInboxThreadId=firstThread.id;
  selectedInboxContact={type:contact.type,id:contact.id};
 }else{
  selectedInboxThreadId=null;

  if(selectedCompanyFilters.length){
   const firstCompanyId=selectedCompanyFilters[0];
   const firstEmployee=employees.find(employee=>employee.companyId===firstCompanyId);

   selectedInboxContact=firstEmployee
    ? {type:'employee',id:firstEmployee.id}
    : {type:'manager',id:firstCompanyId};
  }
 }

 currentView='inbox';
 render();
 setTimeout(scrollMessengerToBottom,0);
}

function unreadForContact(type,id){
 return contactThreads(type,id).filter(thread=>!thread.readByAccountant).length;
}


function threadContactMeta(thread){
 if(thread.recipientType==='manager'){
  const company=companies.find(item=>item.id===thread.companyId);
  return {
   type:'manager',
   id:thread.companyId,
   name:thread.recipientName||company?.contact||'Szef firmy',
   subtitle:company?.name||'Firma'
  };
 }

 const employee=employees.find(item=>item.id===thread.employeeId);
 return {
  type:'employee',
  id:thread.employeeId,
  name:employee?.name||'Pracownik',
  subtitle:employee?companyName(employee.companyId):companyName(thread.companyId)
 };
}


function threadsWithinSelectedCompanies(){
 const all=[...inboxThreads].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));

 if(!selectedCompanyFilters.length){
  return all;
 }

 return all.filter(thread=>selectedCompanyFilters.includes(thread.companyId));
}

function filteredThreadsForContact(){
 const scoped=threadsWithinSelectedCompanies();

 if(inboxFilter==='unread'){
  return scoped.filter(thread=>!thread.readByAccountant);
 }

 if(inboxFilter==='incoming'){
  return scoped.filter(thread=>threadDirectionForAccountant(thread)==='incoming');
 }

 if(inboxFilter==='sent'){
  return scoped.filter(thread=>threadDirectionForAccountant(thread)==='sent');
 }

 if(selectedInboxContactOnly){
  return contactThreads(selectedInboxContact.type,selectedInboxContact.id)
   .filter(thread=>!selectedCompanyFilters.length||selectedCompanyFilters.includes(thread.companyId));
 }

 return scoped;
}

function createPremiumThread(){
 const meta=contactMeta(selectedInboxContact.type,selectedInboxContact.id);
 const subject=document.getElementById('premiumThreadSubject').value.trim();
 const body=document.getElementById('premiumThreadBody').value.trim();
 const category=document.getElementById('premiumThreadCategory').value;
 const file=document.getElementById('premiumThreadFile').files?.[0];

 if(!subject||!body){
  showToast('Wpisz temat i treść wiadomości');
  return;
 }

 const createThreadWithAttachment=attachment=>{
  const now=new Date().toISOString();
  const thread={
   id:Date.now(),
   employeeId:meta.employeeId,
   companyId:meta.companyId,
   recipientType:selectedInboxContact.type,
   recipientName:meta.name,
   subject,
   category,
   status:'Odpowiedziano',
   createdAt:now,
   updatedAt:now,
   readByAccountant:true,
   readByEmployee:false,
   readByManager:false,
   messages:[{
    id:Date.now()+1,
    senderRole:'accountant',
    senderName:'Grażyna Zachwieja',
    body,
    attachment,
    createdAt:now
   }]
  };

  inboxThreads.push(thread);
  selectedInboxThreadId=thread.id;
  closeModal();
  currentView='inbox';
  render();
  setTimeout(scrollMessengerToBottom,0);
  showToast('Nowa sprawa została utworzona');
 };

 if(!file){
  createThreadWithAttachment(null);
  return;
 }

 readPremiumFile(file,createThreadWithAttachment);
}

function preparePremiumAttachment(input){
 const file=input.files?.[0];
 if(!file) return;

 readPremiumFile(file,attachment=>{
  pendingChatAttachment=attachment;
  showPremiumAttachmentPreview();
 });
}

function readPremiumFile(file,callback){
 if(file.size>8*1024*1024){
  showToast('Załącznik może mieć maksymalnie 8 MB w prototypie');
  return;
 }

 const attachment={
  name:file.name,
  type:file.type||'application/octet-stream',
  size:file.size,
  dataUrl:null
 };

 if(file.type.startsWith('image/')){
  const reader=new FileReader();
  reader.onload=()=>{
   attachment.dataUrl=reader.result;
   callback(attachment);
  };
  reader.readAsDataURL(file);
 }else{
  callback(attachment);
 }
}

function showPremiumAttachmentPreview(){
 const preview=document.getElementById('premiumAttachmentPreview');
 if(!preview||!pendingChatAttachment) return;

 preview.style.display='flex';
 preview.innerHTML=`<div class="premium-pending-file">
  <span>${pendingChatAttachment.type?.startsWith('image/')?'🖼️':'📎'}</span>
  <span>
   <strong>${escapeHtml(pendingChatAttachment.name)}</strong>
   <small>${formatPremiumFileSize(pendingChatAttachment.size)}</small>
  </span>
  <button type="button" onclick="removePremiumAttachment()">×</button>
 </div>`;
}

function removePremiumAttachment(){
 pendingChatAttachment=null;

 const input=document.getElementById('premiumFileInput');
 if(input) input.value='';

 const preview=document.getElementById('premiumAttachmentPreview');
 if(preview){
  preview.style.display='none';
  preview.innerHTML='';
 }
}

function sendPremiumMessage(){
 const thread=inboxThreads.find(item=>item.id===selectedInboxThreadId);
 const textarea=document.getElementById('premiumComposer');
 const body=textarea?.value.trim()||'';

 if(!thread||thread.status==='Zamknięte') return;

 if(!body&&!pendingChatAttachment){
  showToast('Napisz wiadomość lub dodaj załącznik');
  return;
 }

 const now=new Date().toISOString();

 thread.messages.push({
  id:Date.now(),
  senderRole:'accountant',
  senderName:'Grażyna Zachwieja',
  body,
  attachment:pendingChatAttachment?{...pendingChatAttachment}:null,
  createdAt:now
 });

 thread.updatedAt=now;
 thread.status='Odpowiedziano';
 thread.readByAccountant=true;
 thread.readByEmployee=false;
 thread.readByManager=false;

 textarea.value='';
 removePremiumAttachment();
 currentView='inbox';
 render();
 setTimeout(scrollMessengerToBottom,0);
}

function handlePremiumComposerKey(event){
 if(event.key==='Enter'&&!event.shiftKey){
  event.preventDefault();
  sendPremiumMessage();
 }
}

function filterPremiumContacts(value){
 const query=value.trim().toLowerCase();

 document.querySelectorAll('.premium-contact').forEach(contact=>{
  contact.style.display=!query||contact.dataset.search.includes(query)?'flex':'none';
 });
}

function scrollMessengerToBottom(){
 const box=document.getElementById('premiumMessages');
 if(box) box.scrollTop=box.scrollHeight;
}

    style="max-width:100%;max-height:68vh;border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.18)">
  </div>
  <footer>
   <button type="button" class="btn" onclick="closeModal()">Zamknij</button>
  </footer>
 `,event=>event.preventDefault());

function escapeHtml(value){
 return String(value||'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'",'&#039;');
}

function formatPremiumFileSize(bytes){
 if(!bytes) return '';
 if(bytes<1024) return `${bytes} B`;
 if(bytes<1024*1024) return `${Math.round(bytes/1024)} KB`;
 return `${(bytes/(1024*1024)).toFixed(1)} MB`;
}

function sendInboxReply(threadId,viewerRole){
 const thread=inboxThreads.find(item=>item.id===threadId);
 const textarea=document.getElementById('threadReply');
 const body=textarea?.value.trim();
 if(!thread||!body){
  showToast('Wpisz treść odpowiedzi');
  return;
 }

 const employee=threadEmployee(thread);
 const now=new Date().toISOString();
 const accountant=viewerRole==='accountant';

 thread.messages.push({
  id:Date.now(),
  senderRole:accountant?'accountant':'employee',
  senderName:accountant?'Grażyna Zachwieja':(employee?.name||'Pracownik'),
  body,
  createdAt:now
 });
 thread.updatedAt=now;
 thread.status=accountant?'Odpowiedziano':'Oczekuje na odpowiedź';
 thread.readByAccountant=accountant;
 thread.readByEmployee=!accountant;

 closeModal();
 showToast('Odpowiedź została wysłana');
 refreshInboxView(viewerRole);
}

function closeInboxThread(threadId){
 const thread=inboxThreads.find(item=>item.id===threadId);
 if(!thread)return;
 thread.status='Zamknięte';
 thread.updatedAt=new Date().toISOString();
 thread.readByAccountant=true;
 closeModal();
 showToast('Rozmowa została zamknięta');
 currentView='inbox';
 render();
}


function restoreInboxThread(threadId){

 thread.status='Oczekuje na odpowiedź';
 thread.updatedAt=new Date().toISOString();
 thread.readByAccountant=true;

 closeModal();
 showToast('Rozmowa została przywrócona');

}

function refreshInboxView(viewerRole){

  currentView='inbox';
  render();
 }else{
  renderEmployee('employeeInbox');
 }
}


const polishHolidays2026 = {
 '2026-01-01':'Nowy Rok',
 '2026-01-06':'Trzech Króli',
 '2026-04-05':'Wielkanoc',
 '2026-04-06':'Poniedziałek Wielkanocny',
 '2026-05-01':'Święto Pracy',
 '2026-05-03':'Święto Konstytucji 3 Maja',
 '2026-05-24':'Zielone Świątki',
 '2026-06-04':'Boże Ciało',
 '2026-08-15':'Wniebowzięcie NMP',
 '2026-11-01':'Wszystkich Świętych',
 '2026-11-11':'Święto Niepodległości',
 '2026-12-25':'Boże Narodzenie',
 '2026-12-26':'Drugi dzień Bożego Narodzenia'
};

function dateKey(year,month,day){
 return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function absenceForDay(employeeId,key){
 return leaveRequests.find(request=>{
  if(request.employeeId!==employeeId) return false;
  if(!['Zaakceptowany','Anulowany'].includes(request.status)) return false;
  if(request.status==='Anulowany') return false;
  return request.from<=key&&request.to>=key;
 });
}

function employeeCalendarView(employee){
 const today=new Date();
 const year=today.getFullYear();
 const month=today.getMonth();
 return `<div class="page-header">
  <div><h2>Kalendarz nieobecności</h2><p>Urlopy, chorobowe, dni pracy i święta.</p></div>
 </div>
 <div class="panel">
  ${renderEmployeeCalendar(employee.id,year,month)}
 </div>`;
}

function renderEmployeeCalendar(employeeId,year,month){
 const monthNames=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
 const firstDay=new Date(year,month,1);
 const daysInMonth=new Date(year,month+1,0).getDate();
 const offset=(firstDay.getDay()+6)%7;
 let cells='';

 for(let i=0;i<offset;i++) cells+='<div class="calendar-day empty-day"></div>';

 for(let day=1;day<=daysInMonth;day++){
  const key=dateKey(year,month,day);
  const date=new Date(year,month,day);
  const weekend=date.getDay()===0||date.getDay()===6;
  const holiday=polishHolidays2026[key];
  const absence=absenceForDay(employeeId,key);

  let cls='work-day';
  let label='Dzień pracy';

  if(holiday){
   cls='holiday-day';
   label=holiday;
  }else if(absence?.type==='Zwolnienie lekarskie'){
   cls='sick-day';
   label='Zwolnienie lekarskie';
  }else if(absence){
   cls='leave-day';
   label=absence.type;
  }else if(weekend){
   cls='weekend-day';
   label='Weekend';
  }

  cells+=`<button type="button" class="calendar-day ${cls}" title="${label}" onclick="showCalendarDay('${key}',${employeeId})">
    <strong>${day}</strong>
    <span>${absence?absence.type:(holiday?holiday:'')}</span>
  </button>`;
 }

 return `<div class="calendar-head">
   <button class="btn" onclick="changeEmployeeCalendar(${employeeId},${year},${month},-1)">←</button>
   <h3>${monthNames[month]} ${year}</h3>
   <button class="btn" onclick="changeEmployeeCalendar(${employeeId},${year},${month},1)">→</button>
  </div>
  <div class="calendar-weekdays">${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="calendar-grid">${cells}</div>
  <div class="calendar-legend">
   <span><i class="legend-box leave-day"></i> Urlop</span>
   <span><i class="legend-box sick-day"></i> Chorobowe</span>
   <span><i class="legend-box work-day"></i> Dzień pracy</span>
   <span><i class="legend-box holiday-day"></i> Święto</span>
  </div>`;
}

function changeEmployeeCalendar(employeeId,year,month,delta){
 const date=new Date(year,month+delta,1);
 const panel=document.querySelector('.employee-view .panel');
 if(panel) panel.innerHTML=renderEmployeeCalendar(employeeId,date.getFullYear(),date.getMonth());
}

function showCalendarDay(key,employeeId){
 const absence=absenceForDay(employeeId,key);
 const holiday=polishHolidays2026[key];
 let text='Normalny dzień pracy';
 if(holiday) text=holiday;
 if(absence) text=`${absence.type}: ${fmt(absence.from)} – ${fmt(absence.to)}`;

 openModal(`Dzień ${fmt(key)}`,`
  <div class="info"><span>Status dnia</span><strong>${text}</strong></div>
  <footer><button type="button" class="btn" onclick="closeModal()">Zamknij</button></footer>
 `,event=>event.preventDefault());
}

function calculateLeaveDays(){
 const from=document.getElementById('leaveFrom')?.value;
 const to=document.getElementById('leaveTo')?.value;
 if(!from||!to)return;
 let start=new Date(from+'T00:00:00');
 let end=new Date(to+'T00:00:00');
 if(end<start){document.getElementById('leaveDays').value='';return}
 let days=0;
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
   const day=d.getDay();
   if(day!==0&&day!==6)days++;
 }
 document.getElementById('leaveDays').value=days;
 const e=employees.find(x=>x.id===selectedEmployeeId);
 const remaining=Math.max(0,(e.leaveTotal-e.leaveUsed)-days);
 document.getElementById('leaveRemaining').textContent=remaining+' dni';
}

 if(!from||!to||!target) return;

 const end=new Date(to+'T00:00:00');

 if(end<start){
  target.value='';

 }

 let days=0;
 for(let date=new Date(start);date<=end;date.setDate(date.getDate()+1)){
  const day=date.getDay();
  if(day!==0&&day!==6) days++;
 }

 target.value=days;
}

function approveLeave(requestId){

 if(!r || r.status!=='Oczekuje')return;

 ensureLeaveApprovalState(r);
 const e=employees.find(x=>x.id===r.employeeId);

 if(managerMode){
  r.managerApproval=true;
 }else{
  r.accountantApproval=true;
 }

 if(r.managerApproval&&r.accountantApproval){
  r.status='Zaakceptowany';

  if(!r.balanceApplied){
   e.leaveUsed+=r.days;
   const year=Number(r.from.slice(0,4));
   const balance=leaveBalances.find(item=>item.employeeId===r.employeeId&&item.year===year);
   if(balance) balance.used+=r.days;
   r.balanceApplied=true;
  }

  notifications=notifications.filter(n=>!(n.type==='urlop'&&n.requestId===requestId));
  closeModal();
  showToast('Wniosek ma obie akceptacje i został zatwierdzony');

}

function workingDaysBetween(from,to){
 if(!from||!to) return 0;
 const start=new Date(from+'T00:00:00');
 const end=new Date(to+'T00:00:00');
 if(end<start) return 0;

 let count=0;
 const cursor=new Date(start);
 while(cursor<=end){
  const day=cursor.getDay();
  if(day!==0&&day!==6) count++;
  cursor.setDate(cursor.getDate()+1);
 }
 return count;
}

function previousCalendarDay(dateString){
 const date=new Date(dateString+'T00:00:00');
 date.setDate(date.getDate()-1);
 return date.toISOString().slice(0,10);
}

function canInterruptLeave(request){
 const leaveTypes=['Urlop wypoczynkowy','Urlop na żądanie'];
 return request.status==='Zaakceptowany' &&
        leaveTypes.includes(request.type) &&
        !request.interrupted &&
        !!request.from &&
        !!request.to &&
        request.to>=request.from &&
        workingDaysBetween(request.from,request.to)>0;
}

  </div>
  <footer>
   <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
   <button type="submit" class="btn primary">Zapisz przerwanie urlopu</button>
  </footer>
 `,event=>{
  event.preventDefault();

  const from=sickFrom.value;
  const to=sickTo.value;

  if(from<request.from||from>request.to){
   showToast('Początek chorobowego musi przypadać w okresie urlopu');
   return;
  }
  if(to<from){
   showToast('Data zakończenia chorobowego jest nieprawidłowa');
   return;
  }

  const originalSnapshot={
   from:request.from,
   to:request.to,
   days:request.days,
   interrupted:request.interrupted||false,
   balanceApplied:request.balanceApplied!==false
  };

  const originalTo=request.to;
  const overlapTo=to<originalTo?to:originalTo;
  const restoredDays=workingDaysBetween(from,overlapTo);
  const dayBefore=previousCalendarDay(from);
  const remainingLeaveDays=from===request.from?0:workingDaysBetween(request.from,dayBefore);

  request.originalSnapshot=originalSnapshot;
  request.interrupted=true;
  request.interruptedFrom=from;
  request.originalTo=originalTo;
  request.originalDays=originalSnapshot.days;

  if(remainingLeaveDays===0){
   request.status='Anulowany';
   request.to=request.from;
   request.days=0;
   request.cancelReason='Urlop w całości zastąpiony zwolnieniem lekarskim';
  }else{
   request.to=dayBefore;
   request.days=remainingLeaveDays;
   request.cancelReason='';
  }

  const sickId=Date.now();
  request.linkedSickId=sickId;

  leaveRequests.push({
   id:sickId,
   employeeId:request.employeeId,
   type:'Zwolnienie lekarskie',
   from,
   to,
   days:workingDaysBetween(from,to),
   status:'Zaakceptowany',
   managerApproval:true,
   accountantApproval:true,
   historical:false,
   linkedLeaveId:request.id,
   notes:sickNotes.value.trim()
  });

  if(originalSnapshot.balanceApplied){
   employee.leaveUsed=Math.max(0,employee.leaveUsed-restoredDays);
   const year=Number(originalSnapshot.from.slice(0,4));
   const balance=leaveBalances.find(item=>item.employeeId===request.employeeId&&item.year===year);
   if(balance) balance.used=Math.max(0,balance.used-restoredDays);
  }

  closeModal();
  showToast(`Urlop przerwany. Przywrócono ${restoredDays} dni do limitu.`);
  openEmployeeTabDirect(employee.id,'leave');
 });
}

function undoLeaveInterruption(requestId){
 const request=leaveRequests.find(r=>r.id===requestId);
 if(!request||!request.originalSnapshot) return;

 const employee=employees.find(e=>e.id===request.employeeId);
 const sick=leaveRequests.find(r=>r.id===request.linkedSickId);

 const snapshot=request.originalSnapshot;
 const restoredDays=sick?workingDaysBetween(sick.from, sick.to<snapshot.to?sick.to:snapshot.to):0;

 request.from=snapshot.from;
 request.to=snapshot.to;
 request.days=snapshot.days;
 request.status='Zaakceptowany';
 request.interrupted=false;
 request.interruptedFrom=null;
 request.cancelReason='';
 request.linkedSickId=null;

 if(snapshot.balanceApplied){
  employee.leaveUsed+=restoredDays;
  const year=Number(snapshot.from.slice(0,4));
  const balance=leaveBalances.find(item=>item.employeeId===request.employeeId&&item.year===year);
  if(balance) balance.used+=restoredDays;
 }

 if(sick){
  leaveRequests=leaveRequests.filter(r=>r.id!==sick.id);
 }

 request.originalSnapshot=null;
 showToast('Cofnięto przerwanie urlopu');
 openEmployeeTabDirect(employee.id,'leave');
}

function editInterruptedLeave(requestId){
 const request=leaveRequests.find(r=>r.id===requestId);
 if(!request||!request.interrupted) return;

 const sick=leaveRequests.find(r=>r.id===request.linkedSickId);
 if(!sick) return;

 openModal('Edytuj okres chorobowego',`
  <div class="form-grid">
   <div class="field">
    <label>Chorobowe od</label>
    <input id="editSickFrom" type="date" value="${sick.from}" min="${request.originalSnapshot?.from||request.from}" max="${request.originalSnapshot?.to||sick.to}" required>
   </div>
   <div class="field">
    <label>Chorobowe do</label>
    <input id="editSickTo" type="date" value="${sick.to}" min="${sick.from}" required>
   </div>
  </div>
  <footer>
   <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
   <button type="button" class="btn danger" onclick="closeModal();undoLeaveInterruption(${requestId})">Cofnij przerwanie</button>
   <button type="submit" class="btn primary">Zapisz zmianę</button>
  </footer>
 `,event=>{
  event.preventDefault();

  const base=request.originalSnapshot;
  if(!base) return;

  const from=editSickFrom.value;
  const to=editSickTo.value;

  if(from<base.from||from>base.to||to<from){
   showToast('Nieprawidłowy okres chorobowego');
   return;
  }

  // Cofnij poprzedni wpływ na bilans.
  const oldOverlapTo=sick.to<base.to?sick.to:base.to;
  const oldRestored=workingDaysBetween(sick.from,oldOverlapTo);
  const employee=employees.find(e=>e.id===request.employeeId);
  if(base.balanceApplied){
   employee.leaveUsed+=oldRestored;
   const balance=leaveBalances.find(item=>item.employeeId===request.employeeId&&item.year===Number(base.from.slice(0,4)));
   if(balance) balance.used+=oldRestored;
  }

  // Ustaw nowy okres.
  sick.from=from;
  sick.to=to;
  sick.days=workingDaysBetween(from,to);

  const newOverlapTo=to<base.to?to:base.to;
  const newRestored=workingDaysBetween(from,newOverlapTo);
  const dayBefore=previousCalendarDay(from);
  const remaining=from===base.from?0:workingDaysBetween(base.from,dayBefore);

  request.from=base.from;
  request.to=remaining===0?base.from:dayBefore;
  request.days=remaining;
  request.status=remaining===0?'Anulowany':'Zaakceptowany';
  request.cancelReason=remaining===0?'Urlop w całości zastąpiony zwolnieniem lekarskim':'';
  request.interruptedFrom=from;

  if(base.balanceApplied){
   employee.leaveUsed=Math.max(0,employee.leaveUsed-newRestored);
   const balance=leaveBalances.find(item=>item.employeeId===request.employeeId&&item.year===Number(base.from.slice(0,4)));
   if(balance) balance.used=Math.max(0,balance.used-newRestored);
  }

  closeModal();
  showToast('Zmieniono okres chorobowego');
  openEmployeeTabDirect(employee.id,'leave');
 });
}

      new Date()>=new Date(addYearsToDate(eDisabilityFrom.value,1)+'T00:00:00')
       ?10:0
     ),
     leaveUsed:0,
     medical:eMedical.value,
     contractType:eContractType.value,
     contract:eContractEnd.value || 'Bezterminowa',
     bhp:eBhp.value,
     notes:eNotes.value
   });
   closeModal();
   showToast('Pracownik został dodany wraz z badaniami i umową');
   currentView='employees';
   render();
 })}


function toggleDisabilityDate(){
 const degree=document.getElementById('eDisabilityDegree');
 const field=document.getElementById('eDisabilityDateField');
 const input=document.getElementById('eDisabilityFrom');
 if(!degree||!field||!input) return;
 const visible=degree.value!=='Brak';
 field.style.display=visible?'block':'none';
 input.required=visible;
 if(!visible) input.value='';
}

function openModal(title,html,onSubmit){document.getElementById('modalTitle').textContent=title;const f=document.getElementById('modalForm');f.innerHTML=html;f.onsubmit=onSubmit;document.getElementById('modalBg').classList.add('open')}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}

function bindDynamic(){}

document.querySelectorAll('#adminNav [data-view]').forEach(btn=>btn.onclick=()=>{currentView=btn.dataset.view;document.querySelectorAll('#adminNav [data-view]').forEach(b=>b.classList.toggle('active',b===btn));render()})
document.querySelectorAll('#employeeNav [data-employee-view]').forEach(btn=>btn.onclick=()=>renderEmployee(btn.dataset.employeeView))
document.querySelectorAll('#managerNav [data-manager-view]').forEach(btn=>btn.onclick=()=>renderManager(btn.dataset.managerView))
document.getElementById('managerModeBtn').onclick=()=>{managerMode=true;employeeMode=false;managerCompanyId=2;renderManager()}
document.getElementById('employeeModeBtn').onclick=()=>{employeeMode=true;managerMode=false;selectedEmployeeId=1;renderEmployee()}
document.getElementById('managerAdminModeBtn').onclick=()=>{managerMode=false;currentView='dashboard';render()}
document.getElementById('adminModeBtn').onclick=()=>{employeeMode=false;managerMode=false;currentView='dashboard';render()}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()}
document.getElementById('globalSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();if(!q)return;const emp=employees.find(x=>x.name.toLowerCase().includes(q));const comp=companies.find(x=>x.name.toLowerCase().includes(q));if(emp)openEmployee(emp.id);else if(comp)openCompany(comp.id)})
render();
</script>
