<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOI HR — Centrum Zarządzania Pracownikami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fc; --surface:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --primary:#4f46e5; --primary-soft:#eef2ff; --success:#047857; --success-bg:#ecfdf5;
  --warning:#c2410c; --warning-bg:#fff7ed; --danger:#b91c1c; --danger-bg:#fef2f2;
  --radius:16px; --shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:#fff;border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:20}
.brand{padding:26px 22px;border-bottom:1px solid var(--border)}
.brand h1{font-size:20px}
.brand p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:12px;color:var(--muted);font-weight:600}
.nav button:hover{background:#f8fafc;color:var(--text)}
.nav button.active{background:var(--primary-soft);color:var(--primary)}
.nav .employee-switch{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.main{margin-left:270px;min-width:0;flex:1}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.search{width:min(420px,48vw)}
.search input{width:100%;height:42px;border:1px solid var(--border);border-radius:12px;padding:0 14px;background:#f8fafc}
.userbox{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#818cf8,#4f46e5);color:#fff;font-weight:700}
.content{padding:28px}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-header h2{font-size:28px;letter-spacing:-.03em}
.page-header p{color:var(--muted);margin-top:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:40px;border-radius:11px;padding:0 16px;border:1px solid var(--border);background:#fff;font-weight:700}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:#fecaca}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.card,.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.02)}
.card{padding:22px}
.card-clickable{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.card-clickable:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.09);border-color:#c7d2fe}
.card-clickable:focus-visible{outline:3px solid rgba(79,70,229,.25);outline-offset:3px}
.card-hint{display:block;margin-top:12px;color:var(--primary);font-size:13px;font-weight:800}
.card small{color:var(--muted);font-weight:600}
.card strong{display:block;font-size:34px;margin-top:7px}
.badge,.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.ok{background:var(--success-bg);color:var(--success)}
.warn{background:var(--warning-bg);color:var(--warning)}
.danger{background:var(--danger-bg);color:var(--danger)}
.neutral{background:#f1f5f9;color:#475569}
.attention{background:#fef3c7;color:#92400e}
.upcoming{background:#dcfce7;color:#166534}
.critical{background:#fee2e2;color:#b91c1c}
.expired{background:#7f1d1d;color:#fff}
.panel{padding:20px;margin-bottom:20px}
.panel h3{font-size:18px;margin-bottom:16px}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tbody tr:hover td{background:#fafcff}
.link{color:var(--primary);font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;color:var(--muted);padding:7px 12px;border-radius:999px;font-weight:600}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;color:var(--muted);padding:30px}
.profile{display:grid;grid-template-columns:220px 1fr;gap:20px}
.profile-card{text-align:center}
.profile-card .avatar{width:86px;height:86px;font-size:24px;margin:0 auto 12px}
.profile-data{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.info{background:#f8fafc;border-radius:12px;padding:13px}
.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow:auto}
.tab{border:0;background:transparent;padding:11px 13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--primary);border-color:var(--primary)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow);width:min(700px,100%);max-height:92vh;overflow:auto}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border)}
.modal form{padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#f8fafc}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding-top:18px}
.employee-view{max-width:1100px;margin:0 auto}
.hero{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;border-radius:22px;padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero p{opacity:.8;margin-top:5px}
.leave-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.leave-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
.leave-card strong{font-size:30px;display:block;margin-top:5px}

.leave-balance{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-bottom:20px}
.balance-main,.balance-side{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px}
.balance-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.balance-head h3{font-size:22px;margin-bottom:4px}
.balance-year{font-weight:800;color:var(--primary);background:#eef2ff;padding:8px 12px;border-radius:12px}
.balance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.balance-stat{padding:15px;border:1px solid var(--border);border-radius:14px;background:#f8fafc}
.balance-stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.balance-stat strong{font-size:25px}
.balance-total{grid-column:1/-1;background:#eef2ff;border-color:#c7d2fe}
.progress-wrap{margin-top:18px}
.progress-info{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.progress-bar{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#7c3aed);border-radius:999px}
.remaining-number{font-size:42px;font-weight:800;line-height:1;color:#059669;margin:10px 0 6px}
.leave-years{display:grid;gap:12px}
.leave-year{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.leave-year summary{list-style:none;cursor:pointer;padding:17px 19px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-weight:800}
.leave-year summary::-webkit-details-marker{display:none}
.leave-year summary:after{content:'⌄';font-size:20px;color:var(--muted);transition:.2s}
.leave-year[open] summary:after{transform:rotate(180deg)}
.year-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.year-summary small{font-weight:500;color:var(--muted)}
.year-body{padding:0 19px 19px;border-top:1px solid var(--border)}
.year-numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.year-number{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--border)}
.year-number span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.year-number strong{font-size:19px}
.leave-mobile-list{display:none}

.status-action{cursor:pointer;border:none;font:inherit;transition:transform .15s ease,box-shadow .15s ease}
.status-action:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.12)}
.status-action:focus-visible{outline:3px solid rgba(79,70,229,.25);outline-offset:2px}
.hidden{display:none!important}
.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:13px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:100}

.upload-box{border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;background:#f8fafc}
.upload-box input{margin-top:10px;max-width:100%}
.doc-list{display:grid;gap:10px}
.doc-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid var(--border);border-radius:12px;background:#fff}
.doc-meta{min-width:0}
.doc-meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap}
.preview-img{max-width:100%;max-height:65vh;border-radius:12px;border:1px solid var(--border)}
.preview-frame{width:100%;height:65vh;border:1px solid var(--border);border-radius:12px}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.split,.profile{grid-template-columns:1fr}.sidebar{width:230px}.main{margin-left:230px}}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0}.topbar{position:static}.grid4,.leave-summary,.form-grid,.profile-data,.leave-balance,.balance-grid,.year-numbers{grid-template-columns:1fr}.content{padding:18px}.search{display:none}.balance-total{grid-column:auto}.leave-year table{display:none}.leave-mobile-list{display:grid;gap:10px}.leave-mobile-item{padding:12px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}.leave-mobile-item strong,.leave-mobile-item span{display:block}.leave-mobile-item span{font-size:13px;color:var(--muted);margin-top:4px}}

.company-status-card{cursor:pointer;transition:.18s}
.company-status-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.09);border-color:#c7d2fe}
.company-status-line{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:20px;font-weight:800}
.company-status-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.company-status-dot.active{background:#16a34a}
.company-status-dot.suspended{background:#d97706}
.company-status-dot.closed{background:#dc2626}
.company-status-dot.archived{background:#64748b}
.company-status-hint{display:block;margin-top:12px;color:var(--primary);font-size:13px;font-weight:800}
.company-status-option{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);border-radius:13px;background:#fff;font-weight:700;font-size:15px;text-align:left}
.company-status-option:hover{background:#f8fafc;border-color:#a5b4fc}
.company-status-option.selected{background:#eef2ff;border-color:#4f46e5}

@keyframes criticalPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(127,29,29,0)}
  50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(127,29,29,.14)}
}
.status.critical-expired,
.badge.critical-expired{
  background:#7f1d1d;
  color:#fff;
  animation:criticalPulse 1.25s ease-in-out infinite;
}
.status.urgent,
.badge.urgent{
  background:#fee2e2;
  color:#b91c1c;
}
.status.important,
.badge.important{
  background:#fef3c7;
  color:#92400e;
}
.status.safe,
.badge.safe{
  background:#dcfce7;
  color:#166534;
}
</style>
</head>

function activeNotifications(){
 return notifications.filter(notification=>{
  if(notification.type==='urlop'){
   const request=leaveRequests.find(r=>r.id===notification.requestId);
   return request && request.status==='Oczekuje';
  }

  if(notification.type==='umowa'){
   const employee=employees.find(e=>e.id===notification.employeeId);
   if(!employee || employee.contract==='Bezterminowa') return false;
   const days=daysToDate(employee.contract);
   return days!==null && days<30;
  }

  if(notification.type==='badania'){
   const employee=employees.find(e=>e.id===notification.employeeId);
   if(!employee) return false;
   const days=daysToDate(employee.medical);
   return days!==null && days<30;
  }

  return false;
 });
}

function taskTable(){
 const rows=[];

 employees.forEach(employee=>{
  const medicalDays=daysToDate(employee.medical);
  if(medicalDays!==null && medicalDays<30){
   rows.push({
    company:companyName(employee.companyId),
    employee:employee.name,
    task:'Badania lekarskie',
    date:employee.medical,
    status:medicalDays<0?'Po terminie':'Pilne',
    statusClass:'critical',
    action:()=>openEmployeeTabDirect(employee.id,'medical')
   });
  }

  if(employee.contract!=='Bezterminowa'){
   const contractDays=daysToDate(employee.contract);
   if(contractDays!==null && contractDays<30){
    rows.push({
     company:companyName(employee.companyId),
     employee:employee.name,
     task:'Kończąca się umowa',
     date:employee.contract,
     status:contractDays<0?'Po terminie':'Pilne',
     statusClass:'critical',
     action:()=>openEmployeeTabDirect(employee.id,'contract')
    });
   }
  }
 });

 leaveRequests
  .filter(request=>request.status==='Oczekuje')
  .forEach(request=>{
   const employee=employees.find(e=>e.id===request.employeeId);
   if(!employee) return;

   rows.push({
    company:companyName(employee.companyId),
    employee:employee.name,
    task:'Wniosek urlopowy',
    date:request.from,
    status:'Oczekuje',
    statusClass:'attention',
    action:()=>openLeaveRequest(request.id)
   });
  });

 rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

 if(!rows.length) return '<div class="empty">Brak pilnych spraw.</div>';

 window.dashboardTaskActions=rows.map(row=>row.action);

 return `<table>
  <thead>
   <tr><th>Firma</th><th>Pracownik</th><th>Zadanie</th><th>Termin</th><th>Status</th></tr>
  </thead>
  <tbody>
   ${rows.map((row,index)=>`
    <tr onclick="dashboardTaskActions[${index}]()" style="cursor:pointer">
     <td>${row.company}</td>
     <td><span class="link">${row.employee}</span></td>
     <td>${row.task}</td>
     <td>${fmt(row.date)}</td>
     <td><span class="status ${row.statusClass}">${row.status}</span></td>
    </tr>
   `).join('')}
  </tbody>
 </table>`;
}

};

function companyStatusDot(status){
 return (companyStatuses[status]||companyStatuses['Aktywna']).dot;

function openCompanyStatusModal(companyId){

  'Zmień status firmy',
  `

   <div>

             onclick="confirmCompanyStatus(${c.id},'${status}')">
      <span class="company-status-dot ${companyStatusDot(status)}"></span>
      <span>${status}</span>

     </button>
    `).join('')}
   </div>
  `,
  function(event){event.preventDefault()}
 );
}

function confirmCompanyStatus(companyId,newStatus){
 const c=companies.find(x=>x.id===companyId);
 if(!c) return;

 if(c.status===newStatus){
  closeModal();
  return;
 }

 openModal(
  'Potwierdź zmianę',
  `
   <p style="color:var(--muted);margin:0 0 18px">${c.name}</p>

   <p style="margin:0 0 22px;font-size:16px;line-height:1.6">

    <strong>„${c.status}”</strong> na <strong>„${newStatus}”</strong>?
   </p>

   <div style="display:flex;justify-content:flex-end;gap:10px">
    <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
    <button type="button" class="btn primary"
            onclick="saveCompanyStatus(${companyId},'${newStatus}')">
     Zmień status
    </button>
   </div>
  `,
  function(event){event.preventDefault()}
 );
}

function saveCompanyStatus(companyId,newStatus){
 const c=companies.find(x=>x.id===companyId);
 if(!c) return;

 c.status=newStatus;
 closeModal();
 openCompany(companyId);

 if(typeof showToast==='function'){
  showToast(`Status firmy zmieniono na „${newStatus}”`);
 }
}

function daysToDate(date){
 if(!date||date==='Bezterminowa') return null;
 const today=new Date();
 today.setHours(0,0,0,0);
 const end=new Date(date+'T00:00:00');
 return Math.ceil((end-today)/(1000*60*60*24));
}

function dateStatusClass(date){
 if(!date||date==='Bezterminowa') return 'neutral';
 const days=daysToDate(date);
 if(days<0) return 'critical-expired';
 if(days<30) return 'urgent';
 if(days<=60) return 'important';
 return 'safe';
}

function dateStatusLabel(date){
 if(!date) return 'Brak terminu';
 if(date==='Bezterminowa') return 'Bezterminowa';
 const days=daysToDate(date);
 if(days<0) return `Krytyczny: po terminie ${Math.abs(days)} dni`;
 if(days===0) return 'Krytyczny: termin dzisiaj';
 if(days<30) return `Pilne: ${days} dni`;
 if(days<=60) return `Ważne: ${days} dni`;
 return `OK: ${days} dni`;
}

function calculateLeaveDays(){
 const from=document.getElementById('leaveFrom')?.value;
 const to=document.getElementById('leaveTo')?.value;
 if(!from||!to)return;
 let start=new Date(from+'T00:00:00');
 let end=new Date(to+'T00:00:00');
 if(end<start){document.getElementById('leaveDays').value='';return}
 let days=0;
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
   const day=d.getDay();
   if(day!==0&&day!==6)days++;
 }
 document.getElementById('leaveDays').value=days;
 const e=employees.find(x=>x.id===selectedEmployeeId);
 const remaining=Math.max(0,(e.leaveTotal-e.leaveUsed)-days);
 document.getElementById('leaveRemaining').textContent=remaining+' dni';
}

 const e=employees.find(x=>x.id===r.employeeId);

function openEditContractForm(employeeId,contractId){
 const employee=employees.find(e=>e.id===employeeId);
 const contract=contractHistory.find(item=>item.id===contractId);
 if(!employee||!contract) return;

 const indefinite=contract.end==='Bezterminowa';

 openModal('Edytuj aktualną umowę',`
  <div class="form-grid">
   <div class="field">
    <label>Rodzaj umowy</label>
    <select id="editContractType">
     ${['Umowa o pracę','Umowa zlecenie','Umowa na okres próbny','B2B','Inna']
      .map(type=>`<option ${type===contract.type?'selected':''}>${type}</option>`).join('')}
    </select>
   </div>

   <div class="field">
    <label>Data rozpoczęcia</label>
    <input id="editContractStart" type="date" value="${contract.start||''}" required>
   </div>

   <div class="field">
    <label>Data zakończenia</label>
    <input id="editContractEnd" type="date" value="${indefinite?'':contract.end||''}" ${indefinite?'disabled':''}>
   </div>

   <div class="field">
    <label>Okres umowy</label>
    <label style="display:flex;align-items:center;gap:9px;padding:11px 0">
     <input id="editContractIndefinite" type="checkbox" ${indefinite?'checked':''}
            onchange="toggleEditContractEndDate()" style="width:auto">
     Umowa bezterminowa
    </label>
   </div>

   <div class="field full">
    <label>Uwagi</label>
    <textarea id="editContractNotes" rows="3">${contract.notes||''}</textarea>
   </div>
  </div>

  <footer>
   <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
   <button type="submit" class="btn primary">Zapisz zmiany</button>
  </footer>
 `,event=>{
   event.preventDefault();

   const isIndefinite=document.getElementById('editContractIndefinite').checked;
   const start=document.getElementById('editContractStart').value;
   const end=document.getElementById('editContractEnd').value;

   if(!isIndefinite&&!end){
    showToast('Wpisz datę zakończenia albo zaznacz umowę bezterminową');
    return;
   }

   if(!isIndefinite&&end<start){
    showToast('Data zakończenia nie może być wcześniejsza niż rozpoczęcie');
    return;
   }

   contract.type=document.getElementById('editContractType').value;
   contract.start=start;
   contract.end=isIndefinite?'Bezterminowa':end;
   contract.notes=document.getElementById('editContractNotes').value.trim();

   employee.contractType=contract.type;
   employee.startDate=contract.start;
   employee.contract=contract.end;
   employee.contractNotes=contract.notes;

   closeModal();
   showToast('Aktualna umowa została poprawiona');
   openEmployeeTabDirect(employeeId,'contract');
 });
}

function toggleEditContractEndDate(){
 const checkbox=document.getElementById('editContractIndefinite');
 const input=document.getElementById('editContractEnd');
 if(!checkbox||!input) return;
 input.disabled=checkbox.checked;
 if(checkbox.checked) input.value='';
}

function openEditEmployeeForm(employeeId){
 const employee=employees.find(e=>e.id===employeeId);
 if(!employee) return;

 openModal('Edytuj dane pracownika',`
  <div class="form-grid">
   <div class="field">
    <label>Imię i nazwisko</label>
    <input id="editEmployeeName" value="${employee.name||''}" required>
   </div>

   <div class="field">
    <label>Firma</label>
    <select id="editEmployeeCompany">
     ${companies.map(c=>`<option value="${c.id}" ${c.id===employee.companyId?'selected':''}>${c.name}</option>`).join('')}
    </select>
   </div>

   <div class="field">
    <label>Stanowisko</label>
    <input id="editEmployeePosition" value="${employee.position||''}" required>
   </div>

   <div class="field">
    <label>Data zatrudnienia</label>
    <input id="editEmployeeStartDate" type="date" value="${employee.startDate||''}">
   </div>

   <div class="field">
    <label>E-mail</label>
    <input id="editEmployeeEmail" type="email" value="${employee.email||''}">
   </div>

   <div class="field">
    <label>Telefon</label>
    <input id="editEmployeePhone" value="${employee.phone||''}">
   </div>

   <div class="field">
    <label>PESEL</label>
    <input id="editEmployeePesel" maxlength="11" value="${employee.pesel||''}">
   </div>

   <div class="field">
    <label>Limit urlopu</label>
    <input id="editEmployeeLeave" type="number" min="0" value="${employee.leaveTotal??26}">
   </div>

   <div class="field">
    <label>BHP ważne do</label>
    <input id="editEmployeeBhp" type="date" value="${employee.bhp||''}">
   </div>

   <div class="field full">
    <label>Uwagi</label>
    <textarea id="editEmployeeNotes" rows="3">${employee.notes||''}</textarea>
   </div>
  </div>

  <footer>
   <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
   <button type="submit" class="btn primary">Zapisz zmiany</button>
  </footer>
 `,event=>{
   event.preventDefault();

   employee.name=document.getElementById('editEmployeeName').value.trim();
   employee.companyId=Number(document.getElementById('editEmployeeCompany').value);
   employee.position=document.getElementById('editEmployeePosition').value.trim();
   employee.startDate=document.getElementById('editEmployeeStartDate').value;
   employee.email=document.getElementById('editEmployeeEmail').value.trim();
   employee.phone=document.getElementById('editEmployeePhone').value.trim();
   employee.pesel=document.getElementById('editEmployeePesel').value.trim();
   employee.leaveTotal=Number(document.getElementById('editEmployeeLeave').value)||0;
   employee.bhp=document.getElementById('editEmployeeBhp').value;
   employee.notes=document.getElementById('editEmployeeNotes').value.trim();

   closeModal();
   showToast('Dane pracownika zostały zaktualizowane');
   openEmployee(employeeId);
 });
}

function confirmDeleteEmployee(employeeId){
 const employee=employees.find(e=>e.id===employeeId);
 if(!employee) return;

 openModal('Usuń pracownika',`
  <p style="font-size:16px;line-height:1.6;margin-bottom:14px">
   Czy na pewno chcesz usunąć pracownika <strong>${employee.name}</strong>?
  </p>

  <div class="status critical" style="display:block;padding:14px;margin-bottom:20px">
   Usunięta zostanie również historia umów, badań, urlopów i powiadomień tego pracownika.
  </div>

  <footer>
   <button type="button" class="btn" onclick="closeModal()">Anuluj</button>
   <button type="button" class="btn danger" onclick="deleteEmployee(${employeeId})">Usuń pracownika</button>
  </footer>
 `,event=>event.preventDefault());
}

function deleteEmployee(employeeId){
 const index=employees.findIndex(e=>e.id===employeeId);
 if(index===-1) return;

 employees.splice(index,1);
 contractHistory=contractHistory.filter(item=>item.employeeId!==employeeId);
 medicalHistory=medicalHistory.filter(item=>item.employeeId!==employeeId);
 leaveBalances=leaveBalances.filter(item=>item.employeeId!==employeeId);
 leaveRequests=leaveRequests.filter(item=>item.employeeId!==employeeId);
 notifications=notifications.filter(item=>item.employeeId!==employeeId);

 closeModal();
 showToast('Pracownik został usunięty');
 currentView='employees';
 selectedEmployeeId=employees[0]?.id||null;
 render();
}

function openModal(title,html,onSubmit){document.getElementById('modalTitle').textContent=title;const f=document.getElementById('modalForm');f.innerHTML=html;f.onsubmit=onSubmit;document.getElementById('modalBg').classList.add('open')}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}

function bindDynamic(){}

document.querySelectorAll('#adminNav [data-view]').forEach(btn=>btn.onclick=()=>{currentView=btn.dataset.view;document.querySelectorAll('#adminNav [data-view]').forEach(b=>b.classList.toggle('active',b===btn));render()})
document.querySelectorAll('#employeeNav [data-employee-view]').forEach(btn=>btn.onclick=()=>renderEmployee(btn.dataset.employeeView))
document.getElementById('employeeModeBtn').onclick=()=>{employeeMode=true;selectedEmployeeId=1;renderEmployee()}
document.getElementById('adminModeBtn').onclick=()=>{employeeMode=false;currentView='dashboard';render()}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()}
document.getElementById('globalSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();if(!q)return;const emp=employees.find(x=>x.name.toLowerCase().includes(q));const comp=companies.find(x=>x.name.toLowerCase().includes(q));if(emp)openEmployee(emp.id);else if(comp)openCompany(comp.id)})
render();
</script>
